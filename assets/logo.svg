<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#1a1410"/>
  
  <!-- Weathered industrial border frame - off-center, chunky -->
  <path d="M12 12 L244 12 L244 244 L12 244 Z" fill="none" stroke="#e8dcc8" stroke-width="2" opacity="0.3"/>
  <path d="M20 20 L236 20 L236 236 L20 236 Z" fill="none" stroke="#b23a1f" stroke-width="1" opacity="0.4"/>
  
  <!-- Floppy-disk shutter body - rusted metal plate, off-center -->
  <polygon points="52,148 204,148 204,232 52,232" fill="#b23a1f"/>
  <polygon points="52,148 204,148 204,156 52,156" fill="#1a1410"/>
  <!-- Shutter metal slide -->
  <polygon points="76,160 180,160 180,196 76,196" fill="#e8dcc8"/>
  <!-- Shutter window - pixel-punk notches -->
  <polygon points="88,168 168,168 168,188 88,188" fill="#1a1410"/>
  <rect x="96" y="174" width="8" height="8" fill="#f0a830"/>
  <rect x="112" y="174" width="8" height="8" fill="#f0a830"/>
  <rect x="128" y="174" width="8" height="8" fill="#f0a830"/>
  <rect x="144" y="174" width="8" height="8" fill="#f0a830"/>
  <!-- Shutter metal grab notch -->
  <rect x="108" y="204" width="40" height="8" fill="#1a1410"/>
  <rect x="112" y="208" width="32" height="4" fill="#f0a830"/>
  <!-- Rusted corrosion blooms on shutter -->
  <polygon points="60,226 78,218 86,228 70,234" fill="#1a1410" opacity="0.6"/>
  <polygon points="188,164 196,172 192,182 184,178" fill="#1a1410" opacity="0.5"/>
  
  <!-- Desert-sun medallion - overlaid on upper shutter, off-center left -->
  <circle cx="128" cy="96" r="68" fill="#1a1410"/>
  <circle cx="128" cy="96" r="68" fill="none" stroke="#b23a1f" stroke-width="4"/>
  <circle cx="128" cy="96" r="60" fill="none" stroke="#f0a830" stroke-width="2"/>
  
  <!-- Sun rays - chunky stencil forms, irregular -->
  <polygon points="128,22 134,40 122,40" fill="#f0a830"/>
  <polygon points="128,170 134,152 122,152" fill="#f0a830"/>
  <polygon points="54,96 72,90 72,102" fill="#f0a830"/>
  <polygon points="202,96 184,90 184,102" fill="#f0a830"/>
  <polygon points="74,42 88,54 80,64" fill="#b23a1f"/>
  <polygon points="182,42 168,54 176,64" fill="#b23a1f"/>
  <polygon points="74,150 88,138 80,128" fill="#b23a1f"/>
  <polygon points="182,150 168,138 176,128" fill="#b23a1f"/>
  
  <!-- Inner sun disc - cracked -->
  <circle cx="128" cy="96" r="38" fill="#b23a1f"/>
  <circle cx="128" cy="96" r="38" fill="none" stroke="#e8dcc8" stroke-width="2"/>
  <circle cx="128" cy="96" r="28" fill="#f0a830"/>
  
  <!-- Central medallion core - save icon abstraction -->
  <polygon points="128,72 144,88 144,104 128,120 112,104 112,88" fill="#1a1410"/>
  <polygon points="128,80 136,88 136,100 128,108 120,100 120,88" fill="#f0a830"/>
  
  <!-- The CRACK - jagged fissure across the medallion -->
  <path d="M70,60 L88,76 L82,88 L100,96 L94,110 L112,118 L106,132 L128,140 L142,128 L158,136 L164,118 L178,124 L186,106 L172,94 L180,78 L162,72 L168,56 L146,64 L136,46 L118,58 L100,44 L94,62 L78,52 Z" fill="none" stroke="#1a1410" stroke-width="3" stroke-linejoin="round"/>
  <path d="M96,96 L112,104 L108,116 L122,120" fill="none" stroke="#1a1410" stroke-width="2"/>
  <path d="M140,86 L152,92 L148,104" fill="none" stroke="#1a1410" stroke-width="2"/>
  
  <!-- Cracked edge pieces - displaced fragments -->
  <polygon points="158,68 166,62 172,70 164,76" fill="#1a1410"/>
  <polygon points="90,124 84,132 92,136 96,128" fill="#1a1410"/>
  <polygon points="146,56 150,48 158,52 154,60" fill="#f0a830" opacity="0.7"/>
  
  <!-- Pixel-punk wear marks on medallion rim -->
  <rect x="66" y="88" width="6" height="6" fill="#e8dcc8" opacity="0.5"/>
  <rect x="182" y="104" width="6" height="6" fill="#e8dcc8" opacity="0.5"/>
  <rect x="118" y="30" width="6" height="6" fill="#e8dcc8" opacity="0.4"/>
  <rect x="134" y="158" width="6" height="6" fill="#e8dcc8" opacity="0.4"/>
  
  <!-- Dusty frontier ground shadow under shutter -->
  <polygon points="40,236 216,236 208,244 48,244" fill="#b23a1f" opacity="0.3"/>
  
  <!-- Small wordmark - tiny, integrated into base -->
  <text x="128" y="252" font-family="monospace" font-size="7" fill="#e8dcc8" text-anchor="middle" letter-spacing="3" opacity="0.6">CRIMSON DESERT</text>
</svg>
